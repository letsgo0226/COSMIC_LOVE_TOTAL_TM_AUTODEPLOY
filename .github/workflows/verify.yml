name: Verify Total TM

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run total TM
      run: |
        chmod +x CosmicLove_TotalTM_AutoDeploy_2KB.sh
        sh CosmicLove_TotalTM_AutoDeploy_2KB.sh
        echo "Total TM fixed point verified."
